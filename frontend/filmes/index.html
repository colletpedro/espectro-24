<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorar — Espectro 24</title>
  <meta name="description" content="A recepção completa de um filme — o que quem odiou, quem amou e quem ficou no meio diz — sem nota média e sem spoilers.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Espectro 24">
  <meta property="og:title" content="Espectro 24 — a recepção completa de um filme, sem spoilers">
  <meta property="og:description" content="A recepção completa de um filme — o que quem odiou, quem amou e quem ficou no meio diz — sem nota média e sem spoilers.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Espectro 24 — a recepção completa de um filme, sem spoilers">
  <meta name="twitter:description" content="A recepção completa de um filme — o que quem odiou, quem amou e quem ficou no meio diz — sem nota média e sem spoilers.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/fonte.js"></script>
  <!-- ?cor=: paleta dos grupos (js/cor.js) -->
  <script src="../js/cor.js"></script>
</head>
<body data-raiz="../">
  <div class="spectrum-bar spectrum-bar--segmented" aria-hidden="true" id="brandBar"></div>

  <!-- [rodada Explorar] /filmes é a página EXPLORAR: o mesmo cabeçalho da
       home (js/cabecalho.js), filtros por assunto, década, gênero e país
       (AND, todos na URL), chips removíveis, grade de stills 16:9 (nunca
       pôster) com 24 por vez, e a vista Índice A–Z. Lê só js/indice.js. -->
  <header class="ed-cabecalho">
    <div class="ed-cabecalho__linha">
      <a class="ed-cabecalho__nome" id="edNome" href="../index.html"></a>

      <div class="search busca ed-cabecalho__busca" id="buscaCaixa" role="search">
        <span class="search__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </span>
        <label class="visually-hidden" for="busca">Buscar filme</label>
        <input id="busca" type="text" autocomplete="off" spellcheck="false"
               role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="buscaResultados">
        <ul class="busca__resultados" id="buscaResultados" role="listbox" aria-label="Resultados da busca" hidden></ul>
        <p class="busca__vazia" id="buscaVazia" role="status" aria-live="polite" hidden></p>
      </div>

      <nav class="ed-cabecalho__nav" aria-label="Seções">
        <a id="edLinkFilmes" href="./" aria-current="page"></a>
        <a id="edLinkMetodo" href="../creditos.html#cred-metodo"></a>
      </nav>
    </div>
  </header>

  <main class="ed-main">
    <section class="ex ed-largura" aria-labelledby="exTitulo">
      <div class="ex-topo">
        <h1 class="ex-titulo" id="exTitulo"></h1>
        <div class="ex-vistas" id="exVistas" role="group" aria-label="Vista"></div>
      </div>
      <form class="ex-filtros" id="exFiltros" onsubmit="return false;"></form>
      <div class="ex-chips" id="exChips"></div>
      <p class="ex-contador" id="exContador" role="status" aria-live="polite"></p>
      <ul class="ex-grade" id="exGrade"></ul>
      <div class="ex-indice" id="exIndice" hidden></div>
      <p class="ex-vazio" id="exVazio" hidden></p>
      <button class="ex-mais" id="exMais" type="button" hidden></button>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="mono">Espectro 24</span>
      <span style="color:var(--text-mute); font-size:0.9rem;">Síntese automática a partir de reviews públicas do Letterboxd. Sem nota média, sem spoilers.</span>
      <!-- [v1.9.29, Entrega 4] O aviso do TMDB, de forma PROEMINENTE — em
           todas as páginas, não só na de créditos. Os termos pedem
           proeminência, e um aviso escondido atrás de um clique não é
           proeminente. Conferido contra a página oficial de atribuição. -->
      <span class="site-footer__aviso">Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB.</span>
      <span class="site-footer__creditos"><a href="../creditos.html">créditos e fontes</a></span>
    </div>
  </footer>

  <script src="../js/indice.js"></script>
  <script src="../js/poster.js"></script>
  <script src="../js/busca.js"></script>
  <script src="../js/selecao.js"></script>
  <script src="../js/textos_home.js"></script>
  <script src="../js/explorar.js"></script>
  <script src="../js/cartoes.js"></script>
  <script src="../js/cabecalho.js"></script>
  <script src="../js/catalogo.js"></script>
</body>
</html>
